<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<aside class="sidebar">
  <div class="brand"><i class="bi bi-kanban fs-5"></i> <span>Project Manager</span></div>
  <nav class="nav flex-column pt-2">
    <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="nav-link active" href="projects.html"><i class="bi bi-folder2-open"></i> Projects</a>
    <a class="nav-link" href="tasks-kanban.html"><i class="bi bi-list-task"></i> Tasks</a>
    <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
    <div class="nav-section-title">Administration</div>
    <a class="nav-link" href="users.html"><i class="bi bi-people"></i> Users</a>
    <a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a>
    <div class="nav-section-title">Account</div>
    <a class="nav-link" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
    <a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
  </nav>
</aside>

<div class="main-content">
  <header class="topbar d-flex align-items-center px-3">
    <button id="sidebarToggle" class="btn btn-light border d-lg-none me-2"><i class="bi bi-list"></i></button>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="projects.html">Projects</a></li>
        <li class="breadcrumb-item active">New Project</li>
      </ol>
    </nav>
  </header>

  <div class="page-content">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header bg-white"><span class="section-title">Create New Project</span></div>
          <div class="card-body">

            <!-- action="{{ route('projects.store') }}" method="POST" -->
            <form action="#" method="POST">
              <!-- @csrf -->

              <div class="mb-3">
                <label class="form-label">Project Name</label>
                <input type="text" class="form-control" name="name" placeholder="e.g. Website Redesign" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="4" placeholder="Briefly describe the project scope..."></textarea>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label">Category</label>
                  <select class="form-select" name="category_id" required>
                    <option value="">Select category</option>
                    <option value="1">Engineering</option>
                    <option value="2">Marketing</option>
                    <option value="3">Sales</option>
                    <option value="4">Operations</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Status</label>
                  <select class="form-select" name="status">
                    <option value="planning">Planning</option>
                    <option value="in_progress">In Progress</option>
                    <option value="review">Review</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label class="form-label">Start Date</label>
                  <input type="date" class="form-control" name="start_date">
                </div>
                <div class="col-md-4">
                  <label class="form-label">End Date</label>
                  <input type="date" class="form-control" name="end_date">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Budget ($)</label>
                  <input type="number" class="form-control" name="budget" placeholder="0.00" min="0" step="0.01">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">Assign Members</label>
                <select class="form-select" name="members[]" multiple size="5">
                  <option value="2">Sara Ahmed — Project Manager</option>
                  <option value="3">Bilal Hussain — Developer</option>
                  <option value="4">Ayesha Malik — Developer</option>
                  <option value="5">Hamza Tariq — Designer</option>
                  <option value="6">Fatima Noor — QA Engineer</option>
                </select>
                <div class="form-text">Hold Ctrl (Windows) / Cmd (Mac) to select multiple members.</div>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a href="projects.html" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Project</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
